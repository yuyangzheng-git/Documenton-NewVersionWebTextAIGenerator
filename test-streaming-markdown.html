<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>流式 Markdown 处理测试</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
      background: #f5f5f5;
    }
    .container {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h1 {
      margin-bottom: 20px;
    }
    .controls {
      margin-bottom: 20px;
      display: flex;
      gap: 10px;
    }
    button {
      padding: 10px 20px;
      background: #2383E2;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover {
      background: #1a6fd4;
    }
    .preview {
      padding: 20px;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      background: #fafafa;
      min-height: 200px;
    }
    .status {
      margin-top: 10px;
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 13px;
    }
    .status.incomplete {
      background: #fff3cd;
      color: #856404;
    }
    .status.complete {
      background: #d4edda;
      color: #155724;
    }
    pre {
      background: #2d2d2d;
      color: #f8f8f2;
      padding: 16px;
      border-radius: 8px;
      overflow-x: auto;
      font-family: 'Courier New', monospace;
    }
    .streaming-incomplete {
      border-left: 3px solid #ff9800;
    }
    code {
      background: rgba(55, 53, 47, 0.08);
      padding: 2px 4px;
      border-radius: 4px;
      font-family: 'Courier New', monospace;
    }
    pre code {
      background: transparent;
    }
    h1, h2, h3, h4 {
      margin-top: 24px;
      margin-bottom: 12px;
    }
    hr {
      border: none;
      border-top: 1px solid rgba(55, 53, 47, 0.2);
      margin: 24px 0;
    }
    .table {
      width: 100%;
      border-collapse: collapse;
      margin: 16px 0;
      border: 1px solid rgba(55, 53, 47, 0.2);
    }
    .table th, .table td {
      padding: 8px 12px;
      border: 1px solid rgba(55, 53, 47, 0.1);
      text-align: left;
    }
    .table th {
      background: rgba(55, 53, 47, 0.05);
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>流式 Markdown 处理测试</h1>
    <p>测试流式输出时的 Markdown 解析和自动补全功能</p>

    <div class="controls">
      <button onclick="startStreaming()">开始流式生成</button>
      <button onclick="reset()">重置</button>
    </div>

    <div class="status" id="status"></div>

    <h3>实时预览</h3>
    <div class="preview" id="preview">
      <p style="color: #999;">等待生成...</p>
    </div>

    <h3>原始 Markdown</h3>
    <pre id="raw" style="margin-top: 10px;">等待生成...</pre>
  </div>

  <script>
    // 模拟流式输出
    const mockStream = `# 测试文档

## 介绍
这是一个测试文档，用于验证流式 Markdown 解析功能。

## 代码块测试
这是一个未完成的代码块，测试自动补全功能：
\`\`\`javascript
function hello() {
  console.log("Hello, world!");
  // 这里的代码还没有结束
  return true;
\`\`\`

## 粗体和斜体测试
这是**粗体文本**，这是*斜体文本*，这是\`\`行内代码\`\`。

## 表格测试
| 列1 | 列2 | 列3 |
|-----|-----|-----|
| 数据1 | 数据2 | 数据3 |
| 数据4 | 数据5 | 数据6 |

## 列表测试
- 列表项1
- 列表项2
- 列表项3

1. 有序列表1
2. 有序列表2
3. 有序列表3

## 引用测试
> 这是一段引用文本。

---

## 结论
流式 Markdown 处理功能测试完成！`;

    let currentIndex = 0;
    let intervalId = null;

    function detectIncompleteMarkdown(text) {
      return {
        hasUnclosedCodeBlock: (text.match(/```/g) || []).length % 2 !== 0,
        hasUnclosedInlineCode: (text.match(/`/g) || []).length % 2 !== 0,
        hasUnclosedBold: (text.match(/\*\*/g) || []).length % 2 !== 0
      };
    }

    function autoCloseMarkdown(text) {
      let result = text;

      // 补全代码块
      const codeBlockMatches = (result.match(/```/g) || []);
      if (codeBlockMatches.length % 2 !== 0) {
        result += '\n```';
      }

      // 补全行内代码
      const inlineCodeCount = (result.match(/`/g) || []).length;
      if (inlineCodeCount % 2 !== 0) {
        result += '`';
      }

      // 补全粗体
      const boldCount = (result.match(/\*\*/g) || []).length;
      if (boldCount % 2 !== 0) {
        result += '**';
      }

      return result;
    }

    function renderMarkdownToHTML(text) {
      let html = text;

      // 转义 HTML
      const escapeHtml = (t) => {
        return t.replace(/[&<>"']/g, (m) => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#039;'
        }[m]));
      };

      // 代码块
      html = html.replace(/```(\w*)\n([\s\S]*?)\n```/g, (match, lang, code) => {
        const escapedCode = escapeHtml(code);
        return '<pre><code>' + escapedCode + '</code></pre>';
      });

      // 未关闭的代码块
      html = html.replace(/```(\w*)\n([\s\S]*?)$/g, (match, lang, code) => {
        const escapedCode = escapeHtml(code);
        return '<pre class="streaming-incomplete"><code>' + escapedCode + '</code></pre>';
      });

      // 行内代码
      html = html.replace(/`([^`]+)`/g, '<code>$1</code>');

      // 标题
      html = html.replace(/^#### (.+)$/gm, '<h4>$1</h4>');
      html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
      html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
      html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');

      // 粗体
      html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');

      // 斜体
      html = html.replace(/\*([^*]+)\*/g, '<em>$1</em>');

      // 分割线
      html = html.replace(/^---$/gm, '<hr />');

      // 列表
      html = html.replace(/^[-*] (.+)$/gm, '<li>$1</li>');
      html = html.replace(/^\d+\. (.+)$/gm, '<li>$1</li>');

      // 引用
      html = html.replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>');

      // 段落
      html = html.replace(/\n\n/g, '</p><p>');
      html = '<p>' + html + '</p>';

      // 清理空段落
      html = html.replace(/<p>\s*<\/p>/g, '');

      // 表格
      const tableLines = text.split('\n').filter(line => line.trim().startsWith('|'));
      if (tableLines.length >= 2) {
        const tableHTML = renderTable(tableLines);
        if (tableHTML) {
          html = html.replace(/<p>.*?<\/p>/g, (match) => {
            if (match.includes('|') && tableLines.some(l => match.includes(l.substring(0, 50)))) {
              return '';
            }
            return match;
          });
          html += tableHTML;
        }
      }

      return html;
    }

    function renderTable(lines) {
      if (lines.length === 0) return '';

      const header = lines[0];
      const rows = lines.slice(1);

      let tableHTML = '<table class="table"><thead><tr>';
      const headerCells = header.split('|').map(c => c.trim()).filter(c => c);
      for (const cell of headerCells) {
        tableHTML += '<th>' + cell + '</th>';
      }
      tableHTML += '</tr></thead><tbody>';

      for (const row of rows) {
        if (row.includes('---')) continue;

        const cells = row.split('|').map(c => c.trim()).filter(c => c);
        if (cells.length > 0) {
          tableHTML += '<tr>';
          for (const cell of cells) {
            tableHTML += '<td>' + cell + '</td>';
          }
          tableHTML += '</tr>';
        }
      }

      tableHTML += '</tbody></table>';
      return tableHTML;
    }

    function startStreaming() {
      if (intervalId) return;

      currentIndex = 0;
      const interval = 50; // 每 50ms 更新一次

      intervalId = setInterval(() => {
        if (currentIndex >= mockStream.length) {
          clearInterval(intervalId);
          intervalId = null;
          updateStatus();
          return;
        }

        currentIndex += Math.floor(Math.random() * 10) + 5; // 随机增加 5-15 个字符
        if (currentIndex > mockStream.length) {
          currentIndex = mockStream.length;
        }

        const currentText = mockStream.substring(0, currentIndex);
        const incomplete = detectIncompleteMarkdown(currentText);
        const safeText = autoCloseMarkdown(currentText);

        // 更新预览
        const preview = document.getElementById('preview');
        preview.innerHTML = renderMarkdownToHTML(safeText);

        // 更新原始 Markdown
        document.getElementById('raw').textContent = safeText;

        // 更新状态
        updateStatus(incomplete);
      }, interval);
    }

    function updateStatus(incomplete) {
      const status = document.getElementById('status');
      if (incomplete && (incomplete.hasUnclosedCodeBlock || incomplete.hasUnclosedInlineCode)) {
        status.className = 'status incomplete';
        status.textContent = '⚠️ 检测到未关闭的 Markdown 语法，已自动补全';
      } else {
        status.className = 'status complete';
        status.textContent = '✅ Markdown 语法完整';
      }
    }

    function reset() {
      if (intervalId) {
        clearInterval(intervalId);
        intervalId = null;
      }
      currentIndex = 0;
      document.getElementById('preview').innerHTML = '<p style="color: #999;">等待生成...</p>';
      document.getElementById('raw').textContent = '等待生成...';
      document.getElementById('status').textContent = '';
    }
  </script>
</body>
</html>
