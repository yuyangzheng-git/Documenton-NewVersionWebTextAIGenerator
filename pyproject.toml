[project]
name = "documenton-python"
version = "1.3.0"
description = "Python components for AI Document Generator"
requires-python = ">=3.8"
dependencies = [
    "pypandoc>=1.13",
]

[tool.uv]
dev-dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
only-include = ["document_generator.py", "cli.py"]
