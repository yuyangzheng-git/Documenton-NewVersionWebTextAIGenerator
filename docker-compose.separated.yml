version: '3.8'

services:
  # 主应用 (Node.js only, Python managed externally)
  app:
    build:
      context: .
      dockerfile: Dockerfile.node-only
    container_name: ai-document-generator
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - REDIS_URL=redis://redis:6379
      - CACHE_ENABLED=1
      # Python path will point to host's uv-managed environment
      - PYTHON_BIN=/host-python/.venv/bin/python3
    env_file:
      - .env.local
    volumes:
      - ./store:/app/store
      - ./public/templates:/app/public/templates
      # Mount Python virtual environment from host
      - python-venv:/host-python:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      - redis
    networks:
      - ai-doc-network

  # Redis 缓存服务
  redis:
    image: redis:7-alpine
    container_name: ai-doc-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - ai-doc-network

  # 可选: Redis Commander - Redis 可视化管理工具
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: ai-doc-redis-commander
    ports:
      - "8081:8081"
    environment:
      - REDIS_HOSTS=local:redis:6379
    restart: unless-stopped
    depends_on:
      - redis
    networks:
      - ai-doc-network

volumes:
  redis-data:
    driver: local
  store:
    driver: local
  templates:
    driver: local
  python-venv:
    driver: local

networks:
  ai-doc-network:
    driver: bridge
