# 热重载开发环境配置
# 支持代码实时修改和自动刷新

services:
  # 主应用 - 开发模式（支持热重载）
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        NEXT_PUBLIC_DIFY_BASE_URL: http://your-server-ip/v1
        NEXT_PUBLIC_DIFY_OUTLINE_KEY: app-YOUR_OUTLINE_KEY_HERE
        NEXT_PUBLIC_DIFY_CHAPTER_KEY: app-YOUR_CHAPTER_KEY_HERE
        NEXT_PUBLIC_DIFY_LLM_KEY: app-YOUR_LLM_KEY_HERE
    container_name: ai-document-generator-dev
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
      - REDIS_URL=redis://redis:6379
      - CACHE_ENABLED=1
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    env_file:
      - .env.local
    volumes:
      # 挂载源代码（支持热重载）
      - ./app:/app/app
      - ./components:/app/components
      - ./lib:/app/lib
      - ./store:/app/store
      - ./public:/app/public
      - ./styles:/app/styles
      - ./types:/app/types
      # 挂载配置文件
      - ./next.config.ts:/app/next.config.ts
      - ./tsconfig.json:/app/tsconfig.json
      - ./tailwind.config.ts:/app/tailwind.config.ts
      # 挂载数据目录
      - ./store:/app/store
      - ./public/templates:/app/public/templates
      # node_modules 使用命名卷（避免主机/容器权限问题）
      - node_modules:/app/node_modules
      - .next:/app/.next
    restart: unless-stopped
    depends_on:
      - redis
    networks:
      - ai-doc-hotreload-network
    command: npm run dev

  # Redis 缓存服务
  redis:
    image: redis:7-alpine
    container_name: ai-doc-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis-hotreload-data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - ai-doc-hotreload-network

  # Redis Commander - Redis 可视化管理工具
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: ai-doc-redis-commander-dev
    ports:
      - "8081:8081"
    environment:
      - REDIS_HOSTS=local:redis:6379
    restart: unless-stopped
    depends_on:
      - redis
    networks:
      - ai-doc-hotreload-network

volumes:
  redis-hotreload-data:
    driver: local
  node_modules:
    driver: local
  .next:
    driver: local

networks:
  ai-doc-hotreload-network:
    driver: bridge
