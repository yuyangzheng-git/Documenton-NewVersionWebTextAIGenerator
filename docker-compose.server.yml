# 服务器生产环境部署配置
# 适用于：将项目部署到Dify所在的同一台服务器
# 服务器IP: your-server-ip

services:
  # 主应用
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_DIFY_BASE_URL: http://host.docker.internal/v1
        NEXT_PUBLIC_DIFY_OUTLINE_KEY: app-YOUR_OUTLINE_KEY_HERE
        NEXT_PUBLIC_DIFY_CHAPTER_KEY: app-YOUR_CHAPTER_KEY_HERE
        NEXT_PUBLIC_DIFY_LLM_KEY: app-YOUR_LLM_KEY_HERE
    container_name: ai-document-generator
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - REDIS_URL=redis://redis:6379
      - CACHE_ENABLED=1
    env_file:
      - .env.local
    # 关键配置：允许容器访问宿主机服务
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./store:/app/store
      - ./public/templates:/app/public/templates
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      - redis
    networks:
      - ai-doc-network

  # Redis 缓存服务
  redis:
    image: redis:7-alpine
    container_name: ai-doc-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - ai-doc-network

  # 可选: Redis Commander - Redis 可视化管理工具
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: ai-doc-redis-commander
    ports:
      - "8081:8081"
    environment:
      - REDIS_HOSTS=local:redis:6379
    restart: unless-stopped
    depends_on:
      - redis
    networks:
      - ai-doc-network

volumes:
  redis-data:
    driver: local
  store:
    driver: local
  templates:
    driver: local

networks:
  ai-doc-network:
    driver: bridge
